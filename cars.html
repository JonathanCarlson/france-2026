<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kate's Mach-E shortlist — moved</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .wrap { max-width: 460px; margin: 16vh auto; padding: 0 22px; text-align: center; }
    a.go { display: inline-block; margin-top: 16px; background: var(--blue); color: #fff;
           text-decoration: none; padding: 12px 20px; border-radius: 999px; font-weight: 600; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  </style>
  <script>
    // Kate's car page moved out of the finished-trip repo into its own home.
    //
    // The access key lives in the URL FRAGMENT (#k=…), and a fragment is exactly
    // what a plain meta-refresh or server redirect is least reliable about
    // carrying. So we forward in JS and copy location.hash explicitly — that way
    // every link already shared, key and all, keeps working untouched.
    (function () {
      var target = 'https://jonathancarlson.github.io/family-cars/cars.html';
      location.replace(target + (location.hash || '') + (location.search || ''));
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div style="font-size:40px">🚗</div>
    <h1>This moved</h1>
    <p>Kate's car list now lives at <b>family-cars</b>. Taking you there…</p>
    <p>If nothing happens, tap below — but re-open your original link so the access key comes along.</p>
    <a class="go" href="https://jonathancarlson.github.io/family-cars/cars.html">Go to the car list →</a>
  </div>
</body>
</html>
